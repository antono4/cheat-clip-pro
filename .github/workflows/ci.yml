name: CI

on:
  push:
    branches:
      - master
      - "fix/**"
      - "perf/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # Only what is needed to import the app + run the tests (no torch/cv2/whisper).
          pip install \
            fastapi uvicorn pydantic python-multipart python-dotenv \
            google-genai requests yt-dlp youtube-transcript-api Pillow httpx pytest

      - name: Compile backend
        run: python -m compileall -q backend

      - name: Run tests
        run: python -m pytest tests/ -q

  frontend-build:
    name: Frontend build (tsc + vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
